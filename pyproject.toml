[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-devtools-plus"
version = "0.1.1"
description = "A focused developer console for Dash applications, powered by Dash hooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dash-devtools-plus contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Dash",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "dash>=3.4.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.entry-points.dash_hooks]
dash-devtools-plus = "dash_devtools_plus"

[project.urls]
Repository = "https://github.com/CNFeffery/dash-devtools-plus"
Issues = "https://github.com/CNFeffery/dash-devtools-plus/issues"

[tool.setuptools.packages.find]
include = ["dash_devtools_plus*"]

[tool.setuptools.package-data]
dash_devtools_plus = ["assets/*.js", "assets/*.css", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
