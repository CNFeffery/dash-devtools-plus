name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: dash_devtools_plus/assets/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          # The Python suite also runs the Renderer integration test in Node.
          node-version: "22.12.0"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install feffery-antd-components dash-mantine-components feffery-utils-components feffery-markdown-components
      - name: Run Python tests
        run: python -m pytest

  python-quality:
    name: Python quality and package build
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: dash_devtools_plus/assets/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check Python style
        run: |
          ruff check .
          ruff format --check .
      - name: Build distribution artifacts
        run: python -m build

  fastapi-backend:
    name: FastAPI backend / Python ${{ matrix.python-version }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: dash_devtools_plus/assets/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FastAPI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fastapi]"
          python -m pip install feffery-utils-components feffery-markdown-components
      - name: Run FastAPI backend tests
        run: python -m pytest tests/test_fastapi_backend.py tests/test_dependency_inventory.py

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Build frontend bundle
        run: npm run build
      - name: Verify generated assets exist
        run: |
          test -s dash_devtools_plus/assets/dash_devtools_plus.js
          test -s dash_devtools_plus/assets/dash_devtools_plus.css
      - name: Share frontend assets with Python jobs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: dash_devtools_plus/assets/
          if-no-files-found: error
          retention-days: 1
